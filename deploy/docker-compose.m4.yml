# Disposable M4 review only. scripts/Test-M4Delivery.ps1 assigns a unique project.
# No host ports or normal local volumes are shared with deploy/docker-compose.yml.
services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_DB: telemetry
      POSTGRES_PASSWORD: ${M4_POSTGRES_PASSWORD:?run scripts/Test-M4Delivery.ps1}
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - reviewdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 3s
      timeout: 5s
      retries: 20

  transformer:
    build:
      context: ..
      dockerfile: deploy/DeliveryReview.Dockerfile
      target: transformer
    environment:
      Kafka__BootstrapServers: kafka:9092
      ConnectionStrings__Telemetry: Host=timescaledb;Database=telemetry;Username=telemetry;Password=${M4_POSTGRES_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  probe:
    build:
      context: ..
      dockerfile: deploy/DeliveryReview.Dockerfile
      target: probe
    environment:
      Kafka__BootstrapServers: kafka:9092
      ConnectionStrings__Telemetry: Host=timescaledb;Database=telemetry;Username=telemetry;Password=${M4_POSTGRES_PASSWORD}
      M4_RUN_ID: ${M4_RUN_ID:?run scripts/Test-M4Delivery.ps1}
      M4_BATCHES: ${M4_BATCHES:-2000}
      M4_SAMPLES: ${M4_SAMPLES:-10}
      M4_DELAY_MS: ${M4_DELAY_MS:-10}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  reviewdata:

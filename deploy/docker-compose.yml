# Local infrastructure for Telemetrix. Start from the repo root:
#   cp deploy/.env.example deploy/.env   (then set POSTGRES_PASSWORD)
#   docker compose -f deploy/docker-compose.yml up -d
# Host clients reach Kafka on localhost:29092; containers use kafka:9092.
# bridge / transformer services are added once they run from the IDE (milestone 3+).
name: telemetrix

services:
  plantsim:
    build:
      context: ..
      dockerfile: src/Telemetrix.PlantSim/Dockerfile
    hostname: plantsim
    environment:
      PlantSim__Endpoint: opc.tcp://plantsim:4840
      PlantSim__PkiPath: /app/pki
      Faults__Random__Enabled: "${PLANTSIM_RANDOM_FAULTS:-false}"
    ports: ["4840:4840"]
    volumes:
      - plantsim-pki:/app/pki

  opc-plc:
    image: mcr.microsoft.com/iotedge/opc-plc:2.15.11
    # --ut allows SecurityMode None for development (NFR-09); add simulation flags from the OPC PLC README.
    command: --pn=50000 --autoaccept --ut
    ports: ["50000:50000"]

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: apache/kafka:4.3.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the service that owns them (ADR-0007), so a typo fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: telemetry
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.4
    ports: ["3000:3000"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  plantsim-pki:
  kafkadata:
  tsdata:

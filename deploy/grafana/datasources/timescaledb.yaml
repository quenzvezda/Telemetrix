apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: telemetry
    isDefault: true
    jsonData:
      database: telemetry
      sslmode: disable
      timescaledb: true
      postgresVersion: 1700
    secureJsonData:
      password: $POSTGRES_PASSWORD

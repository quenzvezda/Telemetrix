name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan all reachable history
        run: gitleaks git --redact --config .gitleaks.toml --log-opts=--all .
      - name: Prove a committed fake private key is rejected
        shell: pwsh
        run: ./scripts/Test-SecretScan.ps1

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests use Testcontainers; Docker is available on ubuntu-latest runners.
      - run: dotnet test --no-build -c Release

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Oldest supported and newest tested Python for telemetrix-query.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist sdk/python
      # A separate consumer: a clean environment with only the wheel installed.
      - name: Install into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/pip" install "$(ls dist/telemetrix_query-*.whl)[test]"
      # Integration tests use testcontainers; Docker is available on ubuntu-latest runners.
      - run: '"$RUNNER_TEMP/consumer/bin/python" -m pytest sdk/python/tests -v'

  delivery-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kill the transformer under deterministic load
        shell: pwsh
        run: ./scripts/Test-M4Delivery.ps1

  edge-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Buffer and drain a short Kafka outage
        shell: pwsh
        # The real 30-minute NFR-02 acceptance run is recorded separately.
        run: ./scripts/Test-M5EdgeOutage.ps1 -OutageSeconds 15

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @fission-ai/openspec@1.14.3 validate --all --strict
        env:
          OPENSPEC_TELEMETRY: "0"
